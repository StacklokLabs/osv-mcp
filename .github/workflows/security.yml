name: Security Scan

on:
  workflow_call:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sundays at midnight

permissions:
  contents: read
  security-events: write

jobs:
  filesystem-scan:
    name: Grype Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run Grype vulnerability scanner in fs mode
      id: grype-scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        path: "."
        output-format: "sarif"
        severity-cutoff: "medium"
        only-fixed: true
        fail-build: true

    - name: Upload scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
      if: always()
      with:
        sarif_file: ${{ steps.grype-scan.outputs.sarif }}
        category: "grype-filesystem"

  image-scan:
    name: Grype Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: stable
        cache: true

    - name: Setup Ko
      uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

    - name: Build image with Ko
      id: ko-build
      env:
        KO_DOCKER_REPO: ko.local
        VERSION: "0.0.0-security-scan"
        CREATION_TIME: "1970-01-01T00:00:00Z"
      run: |
        IMAGE=$(ko build --bare --local --sbom=none --tags security-scan --platform=linux/amd64 ./cmd/server)
        echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT

    - name: Run Grype vulnerability scanner on image
      id: grype-scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ steps.ko-build.outputs.IMAGE }}
        output-format: "sarif"
        severity-cutoff: "medium"
        only-fixed: true
        fail-build: true

    - name: Upload scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
      if: always()
      with:
        sarif_file: ${{ steps.grype-scan.outputs.sarif }}
        category: "grype-image"
